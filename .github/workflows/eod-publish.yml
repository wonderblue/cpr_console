name: Publish EOD CPR site

on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD (blank = last completed session)"
        required: false
        type: string
      site_only:
        description: "Rebuild site from committed CSVs only"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eod-cpr-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Cache Bhavcopy History
        uses: actions/cache@v4
        with:
          path: cpr_output/bhavcopy
          key: bhavcopy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bhavcopy-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run test suite
        run: python -m unittest discover -v

      - name: Scan and build site
        env:
          SCAN_DATE: ${{ inputs.date }}
          SITE_ONLY: ${{ inputs.site_only }}
        run: |
          if [ "${SITE_ONLY}" = "true" ]; then
            python eod_publish.py --site-only --max-sessions 20
          elif [ -n "${SCAN_DATE}" ]; then
            python eod_publish.py "${SCAN_DATE}" --max-sessions 20
          else
            python eod_publish.py --max-sessions 20
          fi

      - name: Validate publication contract
        env:
          SITE_ONLY: ${{ inputs.site_only }}
        run: |
          if [ "${SITE_ONLY}" = "true" ]; then
            python -m publication_contract --output-dir cpr_output --site-dir site
          else
            python -m publication_contract --output-dir cpr_output --site-dir site --require-known
          fi
          git diff --check

      - name: Validate generated site
        run: |
          test -f site/index.html
          test -d site/assets
          test -f site/publication_manifest.json
          test -f site/payload.json
          grep -q 'window.CPR_PAYLOAD_URL' site/index.html
          grep -q 'id="dataStatus"' site/index.html
          grep -q 'data session' site/assets/app.js

      - name: Commit CSV archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpr_output
          if git diff --cached --quiet; then
            echo "No new CSVs"
          else
            git commit -m "EOD CPR scan $(date -u +%Y%m%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
