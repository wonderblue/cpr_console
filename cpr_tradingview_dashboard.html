<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Lightweight CPR Charts — September 2026</title>
    <!-- Inline Tailwind Core Styles for 100% Offline Portability -->
    <style>
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
        
        .header { height: 50px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; shrink: 0; }
        .main-layout { display: flex; height: calc(100vh - 50px); }
        
        /* Sidebar */
        .sidebar { width: 340px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; shrink: 0; }
        .search-box { padding: 10px; border-bottom: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px; }
        .search-input { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 12px; outline: none; }
        .search-input:focus { border-color: #388bfd; }
        .btn-group { display: flex; gap: 6px; }
        .btn { flex: 1; padding: 5px 0; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; text-align: center; }
        .btn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }
        .select-filter { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; padding: 4px 6px; font-size: 11px; outline: none; }
        
        .stock-list { flex: 1; overflow-y: auto; }
        .stock-item { padding: 10px 14px; border-bottom: 1px solid #21262d; cursor: pointer; border-left: 3px solid transparent; transition: background 0.15s; }
        .stock-item:hover { background: #1c2128; }
        .stock-item.selected { background: #1f2937; border-left-color: #388bfd; }
        
        /* Main View */
        .content { flex: 1; display: flex; flex-direction: column; background: #0d1117; overflow: hidden; }
        .metrics-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 10px 16px; background: #161b22; border-bottom: 1px solid #30363d; }
        .metric-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; }
        .metric-label { font-size: 10px; color: #8b949e; text-transform: uppercase; }
        .metric-val { font-size: 14px; font-weight: 700; color: #f0f6fc; margin-top: 2px; }
        
        .chart-section { flex: 1; position: relative; background: #0d1117; display: flex; flex-direction: column; }
        .chart-header { height: 34px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 11px; }
        .legend-tag { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
        .legend-line { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
        
        #chart-container { flex: 1; width: 100%; height: 100%; position: relative; }
        
        /* Bottom Commentary */
        .bottom-panel { height: 140px; background: #161b22; border-top: 1px solid #30363d; padding: 12px 16px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .tv-link-btn { display: inline-flex; align-items: center; gap: 6px; background: #238636; color: #fff; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; text-decoration: none; border: 1px solid #2ea043; }
        .tv-link-btn:hover { background: #2ea043; }
        
        /* Badges */
        .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
        .badge-green { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.4); }
        .badge-red { background: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.4); }
        .badge-amber { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.4); }
        .badge-purple { background: rgba(163, 113, 247, 0.2); color: #bc8cff; border: 1px solid rgba(163, 113, 247, 0.4); }
        .badge-blue { background: rgba(56, 139, 253, 0.2); color: #58a6ff; border: 1px solid rgba(56, 139, 253, 0.4); }
    </style>

        function initChart() {
            const container = document.getElementById('chart-container');
            container.innerHTML = '';

            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth || 800,
                height: container.clientHeight || 400,
                layout: {
                    background: { color: '#0d1117' },
                    textColor: '#c9d1d9',
                },
                grid: {

                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#30363d',
                },
                timeScale: {
                    borderColor: '#30363d',
                    timeVisible: true,
                },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#22c55e',
                downColor: '#ef4444',
                borderVisible: false,
                wickUpColor: '#22c55e',
                wickDownColor: '#ef4444',
            });

            volumeSeries = chart.addHistogramSeries({
                color: '#38bdf8',
                priceFormat: {
                    type: 'volume',
                },
                priceScaleId: '', // overlay
                scaleMargins: {
                    top: 0.8,
                    bottom: 0,
                },
            });

            window.addEventListener('resize', () => {
                if (chart && container) {
                    chart.applyOptions({
                        width: container.clientWidth,
                        height: container.clientHeight,
                    });
                }
            });
        }

        function renderStockList() {
            const list = document.getElementById('stock-list');
            list.innerHTML = '';

            const filtered = STOCKS.filter((s, idx) => {
                if (viewMode === 'TOP20' && idx >= 20) return false;
                if (catFilter === 'Narrow' && !s.CATEGORY.includes('Narrow')) return false;
                if (catFilter === 'Above' && !s.CATEGORY.includes('Above')) return false;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    return s.SYMBOL.toLowerCase().includes(q) || s.NAME.toLowerCase().includes(q);
                }
                return true;
            });

            filtered.forEach(stock => {
                const isSelected = stock.SYMBOL === activeSymbol;
                const isNarrow = stock.CATEGORY.includes('Narrow');
                const chgColor = stock.DAY_CHG_PCT >= 0 ? '#3fb950' : '#f85149';
                const posBadge = stock.Current_Position_LTP === 'Above CPR' 
                    ? '<span class="badge badge-green">Above CPR</span>'
                    : stock.Current_Position_LTP === 'Below CPR'
                    ? '<span class="badge badge-red">Below CPR</span>'
                    : '<span class="badge badge-amber">Inside CPR</span>';

                const item = document.createElement('div');
                item.className = 'stock-item' + (isSelected ? ' selected' : '');
                item.onclick = () => selectStock(stock.SYMBOL);
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <strong style="color: #fff;">#${stock.Rank} ${stock.SYMBOL}</strong>
                            ${isNarrow ? '<span class="badge badge-purple">Narrow</span>' : '<span class="badge badge-blue">Vol Surge</span>'}
                        </div>
                        <span style="font-weight: 700; color: #fff;">₹${stock.LTP.toLocaleString('en-IN')}</span>

                    <div style="display: flex; justify-content: space-between; color: #8b949e; font-size: 11px;">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px;">${stock.NAME}</span>

                    </div>
                `;
                list.appendChild(item);
            });

                </div>
                <div style="background: #0d1117; padding: 6px 10px; border-radius: 4px; border: 1px solid #30363d;">
                    <span style="color: #8b949e;">Status:</span> <strong style="color: ${stock.Current_Position_LTP === 'Above CPR' ? '#3fb950' : stock.Current_Position_LTP === 'Below CPR' ? '#f85149' : '#d29922'};">${stock.Current_Position_LTP}</strong>
                </div>
                <div style="background: #0d1117; padding: 6px 10px; border-radius: 4px; border: 1px solid #30363d;">
                    <span style="color: #8b949e;">Sector:</span> <strong style="color: #58a6ff;">${stock.Industry} ${stock.Nifty500 ? '(N500)' : ''}</strong>
                </div>
            `;

            // Update Chart
            updateChart(stock);
            renderStockList();
        }

        function updateChart(stock) {
            if (!chart) initChart();

            // Clear old price lines
            priceLines.forEach(pl => candleSeries.removePriceLine(pl));
            priceLines = [];

            const rawCandles = HISTORY[stock.SYMBOL] || [];
            
            const candles = rawCandles.map(c => ({
                time: c.time,
                open: c.open,
                high: c.high,
                low: c.low,
                close: c.close
            }));

            const volumes = rawCandles.map(c => ({
                time: c.time,
                value: c.volume,
                color: c.close >= c.open ? 'rgba(34, 197, 94, 0.4)' : 'rgba(239, 68, 68, 0.4)'
            }));

            if (candles.length > 0) {
                candleSeries.setData(candles);
                volumeSeries.setData(volumes);
            }

            // Add CPR lines
            priceLines.push(candleSeries.createPriceLine({
                price: stock.CPR_Top,
                color: '#22c55e',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: 'CPR Top (TC)',
            }));

            priceLines.push(candleSeries.createPriceLine({
                price: stock.Pivot,
                color: '#f59e0b',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Solid,
                axisLabelVisible: true,
                title: 'Pivot',
            }));

            priceLines.push(candleSeries.createPriceLine({
                price: stock.CPR_Bottom,
                color: '#ef4444',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: 'CPR Bottom (BC)',
            }));

            chart.timeScale().fitContent();
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-top20').className = mode === 'TOP20' ? 'btn active' : 'btn';
            document.getElementById('btn-top100').className = mode === 'TOP100' ? 'btn active' : 'btn';
            renderStockList();
        }

        function setCategoryFilter(val) {
            catFilter = val;
            renderStockList();
        }

        document.getElementById('search-input').oninput = function(e) {
            searchQuery = e.target.value;
            renderStockList();
        };

        window.onload = function() {
            initChart();
            selectStock(activeSymbol);
        };
    </script>
</body>
</html>
